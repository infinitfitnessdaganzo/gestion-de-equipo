<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111820">
  <title>Gestión de equipo · Infinit Fitness Daganzo</title>
  <link rel="stylesheet" href="styles.css?v=20261117-azul-corporativo">
  <script type="module" src="app.js?v=20261117-entrenamientos-realizados"></script>
</head>
<body>
  <aside>
    <div class="brand"><span class="mark">IF</span><div>Gestión de equipo<small>Infinit Fitness Daganzo</small></div></div>
    <nav aria-label="Secciones">
      <button data-page="resumen" aria-current="page">Resumen mensual</button>
      <button data-page="socios">Socios</button>
      <button data-page="ausencias">Vacaciones y ausencias</button>
      <button data-page="equipo">Opciones</button>
    </nav>
    <button id="logout" hidden>Cerrar sesión</button>
  </aside>
  <main>
    <div id="notice" role="status" hidden></div>
    <section id="login" class="panel login" hidden>
      <h1>Acceso de gestión</h1>
      <p>Identifícate con tu cuenta de la app en Supabase.</p>
      <form id="loginForm">
        <label>Correo<input name="email" type="email" autocomplete="username" required></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary">Entrar</button>
      </form>
    </section>
    <section id="workspace" hidden>
      <header><div><div class="eyebrow">ENTRENAMIENTO PERSONAL</div><h1 id="title"></h1></div>
        <div class="header-actions">
          <button type="button" id="undoChange" aria-label="Deshacer" title="Deshacer" disabled><span aria-hidden="true">↶</span></button>
          <button type="button" id="redoChange" aria-label="Rehacer" title="Rehacer" disabled><span aria-hidden="true">↷</span></button>
          <button class="primary" id="add"></button>
        </div></header>
      <div class="filters" id="filters">
        <div class="month-picker">
          <div class="month-heading">
            <label for="month">Mes</label>
            <button type="button" id="currentMonth" aria-label="Hoy, volver al mes actual">Hoy</button>
          </div>
          <div class="month-control">
            <button type="button" id="prevMonth" aria-label="Mes anterior">‹</button>
            <input type="month" id="month" required>
            <button type="button" id="nextMonth" aria-label="Mes siguiente">›</button>
          </div>
        </div>
        <div class="trainer-picker" id="trainerPicker">
          <span id="trainerLabel">Entrenador</span>
          <div id="trainerButtons" role="group" aria-labelledby="trainerLabel"></div>
          <input type="hidden" id="trainer">
        </div>
      </div>
      <div id="content"></div>
      <section id="backupPanel" class="panel" hidden>
        <div class="sectionHead">
          <div><h2>Copias de seguridad</h2><p>Descarga una copia de los datos o restaura un archivo JSON.</p></div>
          <div class="header-actions">
            <button type="button" id="exportBackup">Exportar copia</button>
            <button type="button" id="importBackup">Importar copia</button>
            <input id="backupFile" type="file" accept=".json,application/json" hidden>
          </div>
        </div>
      </section>
    </section>
  </main>
  <dialog id="editor"><form id="recordForm">
    <header><h2 id="editorTitle"></h2><button type="button" id="close" aria-label="Cerrar">×</button></header>
    <div class="fields" id="fields"></div>
    <p id="formError" role="alert" hidden></p>
    <footer><button type="button" id="deleteMember" class="danger-button" hidden>Borrar definitivamente</button><button type="button" id="cancel">Cancelar</button><button class="primary" id="save">Guardar</button></footer>
  </form></dialog>
</body>
</html>
